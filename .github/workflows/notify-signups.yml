# 새 가입 신청을 협의회 메일로 알립니다 (30분마다).
# 저장소 Settings → Secrets and variables → Actions 에 넣어주세요.
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (공고문 읽기와 같은 값)
#   GMAIL_APP_PASSWORD  협의회 Gmail의 "앱 비밀번호" 16자리 (2단계 인증을 켠 뒤 발급)
# 받는 사람을 바꾸려면 Variables 에 NOTIFY_TO (쉼표로 여러 명) 를 넣으세요. 없으면 협의회 Gmail로 보냅니다.
name: 가입 신청 알림
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "11 1 1 * *"      # 매월 1일: 저장소 활동 기록(60일 동안 활동이 없으면 GitHub가 예약 실행을 멈춤)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 메일 도구 설치
        run: npm install --no-save --no-audit --no-fund nodemailer@6.9.16
      - name: 새 신청 확인 · 알림
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: changneung.s4@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ vars.NOTIFY_TO }}
        run: node supabase/scripts/notify-signups.mjs
      - name: 월 1회 활동 기록
        if: github.event.schedule == '11 1 1 * *'
        run: |
          date -u +%Y-%m-%dT%H:%MZ > .github/last-alive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-alive
          git commit -m "예약 실행 유지용 월간 기록" || exit 0
          git push
